name: Refine issue
# .gitea/workflows/refine-issue.yaml — expands a labelled issue into a
# project-aware description. Label `refine-issue-agent` first, review the
# result, then label `coder-agent` to have it implemented.
#
# The action repos are fetched with actions/checkout and then called by local
# path: `uses: <url>/...` is resolved before the job starts and cannot carry a
# token, so it fails on a private action repo (go-gitea/gitea#26032, #27935).
# The local path form works and gives us the action's outputs.
#
# Needs, ideally set ONCE on the org:
#   ACTION_CLONE_TOKEN  secret   PAT with read:repository for the action repos
#   ISSUE_LLM_TOKEN     secret   bearer token for the LLM endpoint
#   ISSUE_LLM_BASE_URL  var      OpenAI-compatible base URL incl. /v1
#   ISSUE_LLM_MODEL     var      model name
#   MM_WEBHOOK_URL      secret/var  Mattermost incoming webhook (secret preferred)
#   INTERNAL_NO_PROXY   var      hosts that bypass the proxy (optional)

run-name: "Refine · issue #${{ gitea.event.issue.number }} — ${{ gitea.event.issue.title }}"

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    # Gitea maps `labeled` to action `label_updated`; the added label's name is
    # in changes.added_labels[0] (empty on unrelated events, so they skip).
    if: ${{ gitea.event.action == 'label_updated' && gitea.event.changes.added_labels[0].name == 'refine-issue-agent' }}
    steps:
      # The repository being analysed. Without this there is nothing to read.
      - name: Check out this repository
        uses: https://gitea.example.com/actions/checkout@v4

      - name: Fetch the action
        uses: https://gitea.example.com/actions/checkout@v4
        with:
          repository: gitea/refine-issue-action
          ref: main
          token: ${{ secrets.ACTION_CLONE_TOKEN || secrets.GITEA_TOKEN }}
          # Beside the project, and skipped when the context is assembled — the
          # model must not see the action as project code.
          path: .action
          persist-credentials: false

      - name: Fetch the notify action
        uses: https://gitea.example.com/actions/checkout@v4
        with:
          repository: gitea/notify-workflow-action
          ref: main
          token: ${{ secrets.ACTION_CLONE_TOKEN || secrets.GITEA_TOKEN }}
          path: .actions/notify-workflow-action
          persist-credentials: false

      - name: Refine this issue
        id: refine
        uses: ./.action
        with:
          issue-llm-base-url: ${{ vars.ISSUE_LLM_BASE_URL }}
          issue-llm-model:    ${{ vars.ISSUE_LLM_MODEL }}
          issue-llm-token:    ${{ secrets.ISSUE_LLM_TOKEN }}
          forge-token:        ${{ secrets.GITEA_TOKEN }}   # automatic per-job token

      # always(): the message you actually want is the one about a failure.
      # Suppressed when the action bailed out for a missing label.
      - name: Notify result
        if: always() && steps.refine.outputs.skipped != 'true'
        uses: ./.actions/notify-workflow-action
        with:
          webhook_url: ${{ secrets.MM_WEBHOOK_URL || vars.MM_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Refine ${{ job.status }} · ${{ gitea.repository }} #${{ gitea.event.issue.number }}"
          text: ${{ gitea.event.issue.title }}
          # issue-url is empty on failure, so fall back to the triggering issue.
          link: ${{ steps.refine.outputs.issue-url || gitea.event.issue.html_url }}
          fields: >-
            [{"title":"Modell","value":"${{ vars.ISSUE_LLM_MODEL }}","short":true},
             {"title":"Fehler","value":"${{ steps.refine.outputs.error || '—' }}","short":true}]
          no_proxy: ${{ vars.INTERNAL_NO_PROXY }}
